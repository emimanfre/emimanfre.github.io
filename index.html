<style>
:root{

--accent:#1F4FD8;--mark:#E8A317;--row:#F8FAFC;--line:#BFCADB;--none:#9AA6BC;
--c0:#1F4FD8;--c1:#E8A317;--c2:#0E9F8E;--c3:#D6336C;--c4:#7B3FD1;--c5:#3B8F2E;--c6:#E4572E;--c7:#5C6B8A;

}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
margin:0;background:var(--paper);color:var(--ink);

background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:32px 32px;
}
h1,h2,h3,nav,.btn,button,.label,legend{font-family:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif}
h1,h2,h3{line-height:1.1;margin:0}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 1.25rem}
nav{display:flex;gap:1.5rem;align-items:center;padding:1.25rem 0;font-weight:700}
nav .brand{margin-right:auto;font-weight:800}
nav a{color:var(--ink);text-decoration:none}
nav a:hover{color:var(--accent)}
.hero{padding:2.5rem 0 2rem}
.kicker{font-weight:700;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 .9rem}
.hero h1{font-size:clamp(2.6rem,8vw,5rem);font-weight:800;letter-spacing:-.025em}
.lead{max-width:44ch;color:var(--muted);margin:1.1rem 0 1.5rem}
.actions{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{display:inline-block;padding:.6rem 1.15rem;font-weight:700;text-decoration:none;border:2px solid var(--ink);color:var(--ink);transition:background .15s,color .15s}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.modebar{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1rem;margin-bottom:1.25rem}
.mode{display:inline-flex;border:2px solid var(--ink)}
.mode button{font:800 .95rem 'Bricolage Grotesque',sans-serif;background:var(--row);color:var(--ink);border:0;padding:.55rem 1.1rem;cursor:pointer;transition:background .15s,color .15s}
.mode button+button{border-left:2px solid var(--ink)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.plot{margin:0;background:var(--row);border:1px solid var(--line);padding:1.1rem 1.1rem .9rem;box-shadow:8px 8px 0 var(--line)}
.label{font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.plot svg{width:100%;height:auto;display:block;margin-top:.4rem;touch-action:pan-y;user-select:none}
.edge{stroke:var(--line);stroke-linecap:round;opacity:.6;transition:opacity .15s}
a.node{cursor:pointer;outline:none;transition:opacity .15s}
a.node circle{stroke:var(--row);stroke-width:3;transform-box:fill-box;transform-origin:center;transition:transform .18s,fill .3s}
a.node:hover circle,a.node:focus circle,a.node.hl circle{transform:scale(1.25)}
a.node:focus-visible circle{stroke:var(--ink)}
a.node.none circle{fill:var(--none)}
.num{fill:#fff;font:800 13px 'Bricolage Grotesque',sans-serif;pointer-events:none;text-anchor:middle}
.nlabel{fill:var(--ink);font:700 14px 'Bricolage Grotesque',sans-serif;paint-order:stroke;stroke:var(--row);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
a.node.none .nlabel{fill:var(--muted)}
svg.dim a.node:not(.hl){opacity:.28}
svg.dim .edge:not(.hl){opacity:.1}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .5rem;list-style:none;margin:.8rem 0 0;padding:0;font:700 .85rem 'Bricolage Grotesque',sans-serif}

.legend button:hover{border-color:var(--line)}

.bubble circle{fill:color-mix(in srgb,var(--muted) 7%,transparent);stroke:var(--line);stroke-width:2;stroke-dasharray:6 6}

.legend .pbtn{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-right:.3rem}
.legend .pbtn::before{display:none}
.legend small{font-weight:400;color:var(--muted)}
.preview{min-height:3.8rem;margin-top:.7rem;padding-top:.7rem;border-top:1px dashed var(--line)}
.preview strong{display:block;font:800 1.25rem 'Bricolage Grotesque',sans-serif}
.preview span{color:var(--muted);font-size:.92rem}
.preview b{color:var(--ink)}
section{padding:2.5rem 0}
h2{font-size:1.9rem;font-weight:800;margin-bottom:1.5rem}
h2::after{content:"";display:block;width:3rem;height:4px;background:var(--mark);margin-top:.6rem}
.about-text{max-width:62ch;margin:0}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.skills div{background:var(--row);border:1px solid var(--line);border-top:4px solid var(--accent);padding:1rem 1rem 1.1rem}
.skills h3{font-size:1.1rem;margin-bottom:.45rem}
.skills p{margin:0;color:var(--muted);font-size:.95rem}
.detail{padding:1rem 0 2rem}
.back{font:700 1rem 'Bricolage Grotesque',sans-serif;text-decoration:none;display:inline-block;margin-bottom:1.5rem}
.detail h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;letter-spacing:-.02em;margin:.4rem 0 .6rem}
.detail .year{font-weight:700;color:var(--muted)}

.meta span{font-size:.85rem;background:var(--row);border:1px solid var(--line);padding:.1rem .6rem}
.meta .m{border-left:4px solid var(--accent)}
.meta .c{border-left:4px solid var(--mark)}
.meta .t{color:var(--muted)}
.detail .desc{max-width:62ch;font-size:1.15rem}
.detail h3{font-size:1.2rem;margin:1.75rem 0 .4rem}
.detail .sec{max-width:62ch;margin:0}
.related{margin:0;padding-left:1.2rem}
.related small{color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:1.25rem;border-top:1px solid var(--line);font-family:'Bricolage Grotesque',sans-serif;font-weight:700}

footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.75rem;margin-top:2rem;padding:1.5rem 0 3rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer a{color:var(--muted)}
@media (max-width:720px){nav{gap:1rem}}
@media (prefers-reduced-motion:reduce){a.node circle,.edge,a.node,.btn,.mode button{transition:none}html{scroll-behavior:auto}}
</style>
</head>
