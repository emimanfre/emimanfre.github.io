<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emilio Manfredi | Applied Statistics and Data Science</title>
<meta name="description" content="Portfolio of Emilio Manfredi: applied statistics, data science, models, inference and visualization.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF1F6; --ink:#16213A; --muted:#58647D; --grid:#D6DEE9;
  --accent:#1F4FD8; --mark:#E8A317; --row:#F8FAFC; --line:#BFCADB; --none:#9AA6BC;
  --c0:#1F4FD8; --c1:#E8A317; --c2:#0E9F8E; --c3:#D6336C; --c4:#7B3FD1; --c5:#3B8F2E; --c6:#E4572E; --c7:#5C6B8A;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#10182B; --ink:#E7ECF6; --muted:#93A0BA; --grid:#1D2742;
    --accent:#7EA0FF; --mark:#F2B73A; --row:#151F37; --line:#2E3B5C; --none:#5A6783;
    --c0:#7EA0FF; --c1:#F2B73A; --c2:#3CCBB8; --c3:#F06A9B; --c4:#B18CF2; --c5:#7BCB6B; --c6:#FF8A66; --c7:#9AA9C6;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 1.0625rem/1.65 Literata,Georgia,serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;
}
h1,h2,h3,nav,.btn,button,.label,legend{font-family:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif}
h1,h2,h3{line-height:1.1;margin:0}
a{color:var(--accent)}
a:focus-visible,button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:0 1.25rem}

nav{display:flex;gap:1.5rem;align-items:center;padding:1.25rem 0;font-weight:700}
nav .brand{margin-right:auto;font-weight:800}
nav a{color:var(--ink);text-decoration:none}
nav a:hover{color:var(--accent)}

.hero{padding:2.5rem 0 2rem}
.kicker{font-weight:700;font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 .9rem}
.hero h1{font-size:clamp(2.6rem,8vw,5rem);font-weight:800;letter-spacing:-.025em}
.lead{max-width:44ch;color:var(--muted);margin:1.1rem 0 1.5rem}
.actions{display:flex;flex-wrap:wrap;gap:.75rem}
.btn{display:inline-block;padding:.6rem 1.15rem;font-weight:700;text-decoration:none;border:2px solid var(--ink);color:var(--ink);transition:background .15s,color .15s}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:hover{background:var(--accent);border-color:var(--accent);color:#fff}

/* mode switch */
.modebar{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem 1rem;margin-bottom:1.25rem}
.mode{display:inline-flex;border:2px solid var(--ink)}
.mode button{font:800 .95rem 'Bricolage Grotesque',sans-serif;background:var(--row);color:var(--ink);border:0;padding:.55rem 1.1rem;cursor:pointer;transition:background .15s,color .15s}
.mode button+button{border-left:2px solid var(--ink)}
.mode button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* graph */
.plot{margin:0;background:var(--row);border:1px solid var(--line);padding:1.1rem 1.1rem .9rem;box-shadow:8px 8px 0 var(--line)}
.label{font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.plot svg{width:100%;height:auto;display:block;margin-top:.4rem;touch-action:pan-y;user-select:none}
.edge{stroke:var(--line);stroke-linecap:round;opacity:.6;transition:opacity .15s}
a.node{cursor:pointer;outline:none;transition:opacity .15s}
a.node circle{stroke:var(--row);stroke-width:3;transform-box:fill-box;transform-origin:center;transition:transform .18s,fill .3s}
a.node:hover circle,a.node:focus circle,a.node.hl circle{transform:scale(1.25)}
a.node:focus-visible circle{stroke:var(--ink)}
a.node.none circle{fill:var(--none)}
.num{fill:#fff;font:800 13px 'Bricolage Grotesque',sans-serif;pointer-events:none;text-anchor:middle}
.nlabel{fill:var(--ink);font:700 14px 'Bricolage Grotesque',sans-serif;paint-order:stroke;stroke:var(--row);stroke-width:5px;stroke-linejoin:round;pointer-events:none}
a.node.none .nlabel{fill:var(--muted)}
svg.dim a.node:not(.hl){opacity:.28}
svg.dim .edge:not(.hl){opacity:.1}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .5rem;list-style:none;margin:.8rem 0 0;padding:0;font:700 .85rem 'Bricolage Grotesque',sans-serif}
.legend button{display:flex;align-items:center;gap:.45rem;background:none;border:1px solid transparent;padding:.25rem .7rem;border-radius:999px;font:inherit;color:var(--ink);cursor:pointer}
.legend button::before{content:"";width:.85rem;height:.85rem;border-radius:50%;background:var(--k)}
.legend button:hover{border-color:var(--line)}
.legend button[aria-pressed="true"]{border-color:var(--ink);background:var(--paper)}
.bubble circle{fill:color-mix(in srgb,var(--muted) 7%,transparent);stroke:var(--line);stroke-width:2;stroke-dasharray:6 6}
.bubble text{fill:var(--muted);font:800 12px 'Bricolage Grotesque',sans-serif;letter-spacing:.1em;text-anchor:middle;pointer-events:none}
.legend li.grp{display:flex;flex-wrap:wrap;align-items:center;gap:.1rem .2rem;padding:.15rem .35rem;border:1px dashed var(--line);border-radius:999px}
.legend .pbtn{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);padding-right:.3rem}
.legend .pbtn::before{display:none}
.legend small{font-weight:400;color:var(--muted)}
.preview{min-height:3.8rem;margin-top:.7rem;padding-top:.7rem;border-top:1px dashed var(--line)}
.preview strong{display:block;font:800 1.25rem 'Bricolage Grotesque',sans-serif}
.preview span{color:var(--muted);font-size:.92rem}
.preview b{color:var(--ink)}

section{padding:2.5rem 0}
h2{font-size:1.9rem;font-weight:800;margin-bottom:1.5rem}
h2::after{content:"";display:block;width:3rem;height:4px;background:var(--mark);margin-top:.6rem}
.about-text{max-width:62ch;margin:0}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
.skills div{background:var(--row);border:1px solid var(--line);border-top:4px solid var(--accent);padding:1rem 1rem 1.1rem}
.skills h3{font-size:1.1rem;margin-bottom:.45rem}
.skills p{margin:0;color:var(--muted);font-size:.95rem}

/* project page */
.detail{padding:1rem 0 2rem}
.back{font:700 1rem 'Bricolage Grotesque',sans-serif;text-decoration:none;display:inline-block;margin-bottom:1.5rem}
.detail h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800;letter-spacing:-.02em;margin:.4rem 0 .6rem}
.detail .year{font-weight:700;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:.4rem .5rem;margin:1rem 0 1.5rem}
.meta span{font-size:.85rem;background:var(--row);border:1px solid var(--line);padding:.1rem .6rem}
.meta .m{border-left:4px solid var(--accent)}
.meta .c{border-left:4px solid var(--mark)}
.meta .t{color:var(--muted)}
.detail .desc{max-width:62ch;font-size:1.15rem}
.detail h3{font-size:1.2rem;margin:1.75rem 0 .4rem}
.detail .sec{max-width:62ch;margin:0}
.related{margin:0;padding-left:1.2rem}
.related small{color:var(--muted)}
.pager{display:flex;justify-content:space-between;gap:1rem;margin-top:3rem;padding-top:1.25rem;border-top:1px solid var(--line);font-family:'Bricolage Grotesque',sans-serif;font-weight:700}
.pager a{text-decoration:none}

footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.75rem;margin-top:2rem;padding:1.5rem 0 3rem;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
footer a{color:var(--muted)}
@media (max-width:720px){nav{gap:1rem}}
@media (prefers-reduced-motion:reduce){a.node circle,.edge,a.node,.btn,.mode button{transition:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
  <nav aria-label="Main">
    <a class="brand" href="#top" id="brand"></a>
    <a href="#about">About</a>
    <a href="#projects">Projects</a>
    <a href="#skills">Skills</a>
  </nav>

  <main id="home">
    <header class="hero" id="top">
      <p class="kicker">Portfolio</p>
      <h1 id="name"></h1>
      <p class="lead" id="tagline"></p>
      <div class="actions" id="actions"></div>
    </header>

    <section id="projects" style="padding-top:1.5rem">
      <div class="modebar" id="pick"></div>
      <figure class="plot">
        <div class="label" id="plot-label"></div>
        <div id="graph"></div>
        <ul class="legend" id="legend" aria-label="Groups (click to highlight)"></ul>
        <figcaption class="preview" id="preview" aria-live="polite"></figcaption>
      </figure>
    </section>

    <section id="about">
      <h2>About</h2>
      <p class="about-text" id="about-text"></p>
    </section>

    <section id="skills">
      <h2>Skills</h2>
      <div class="skills" id="skill-list"></div>
    </section>
  </main>

  <main class="detail" id="detail" hidden></main>

  <footer id="footer"></footer>
</div>

<script>
/* =========================================================
   CONFIG: edit only this part
   Every project has a "method" (statistical methodology) and a
   "model" (model family and code, e.g. "GLM · R"). A switch above
   the graph groups the projects by one or the other.
   "method" must be one of the leaves of "methodTree" below.
   ========================================================= */
const CONFIG = {
  name: "Emilio Manfredi",
  tagline: "Applied Statistics and Data Science: models, inference and visualization.",
  about: "A collection of personal projects",
  contacts: [
    { label: "GitHub", url: "https://github.com/emimanfre" }
    // { label: "LinkedIn", url: "https://www.linkedin.com/in/your-profile" },
    // { label: "Email",    url: "mailto:you@example.com" }
  ],
  skills: [
    { title: "Languages",     text: "R, Python, SQL" },
    { title: "Models",        text: "Parametric and Nonparametric Regression and Classification, Model-Based Clustering, Neural Networks" },
    { title: "Inference",     text: "Hypothesis testing and confidence intervals, bootstrap, computational methods for simulation" },
    { title: "Visualization", text: "ggplot2, matplotlib" }
  ],
  /* Methodology tree: a name with "children" is split into sub-groups. */
  methodTree: [
    { name: "Supervised learning", children: ["Regression", "Classification"] },
    { name: "Unsupervised learning" },
    { name: "Simulation" }
  ],
  startMode: "method",   // "method" or "model": what the graph shows at first
  /* DEMO projects: replace with your own.
     "tools" (optional) and "details" (optional) appear on the project page. */
  projects: [
    { title: "Project title 1", year: 2022, method: "Regression", model: "Linear & GLM · R", tools: ["R", "ggplot2"],
      description: "Placeholder: the question you asked, the data you used and what you found.",
      details: [
        { heading: "Question", text: "What you wanted to find out, and why it matters." },
        { heading: "Data and methods", text: "Where the data come from and which models or tests you used." },
        { heading: "Results", text: "The main findings, with the key numbers." }
      ],
      links: [{ label: "Code", url: "https://github.com/emimanfre" }] },
    { title: "Project title 2", year: 2022, method: "Regression", model: "Linear & GLM · R", tools: ["R", "forecast"],
      description: "Placeholder: forecasting a time series with ARIMA and smoothing models.",
      links: [{ label: "Code", url: "https://github.com/emimanfre" }] },
    { title: "Project title 3", year: 2023, method: "Regression", model: "Bayesian models · Stan", tools: ["R", "brms", "Stan"],
      description: "Placeholder: Bayesian estimation of an effect with informative priors.",
      links: [{ label: "Code", url: "https://github.com/emimanfre" }] },
    { title: "Project title 4", year: 2024, method: "Classification", model: "Machine learning · Python", tools: ["Python", "scikit-learn"],
      description: "Placeholder: comparing classifiers on a real dataset.",
      links: [{ label: "Code", url: "https://github.com/emimanfre" }] },
    { 
      title: "Taiwanese Bankruptcy Prediction", 
      year: 2024, // (o l'anno in cui l'hai svolto/pubblicato)
      method: "Classification", // IMPORTANTE: deve corrispondere a una foglia di methodTree
      model: "Machine learning · R", 
      tools: ["R", "caret", "Boruta", "pROC", "ROCR", "ROSE"],
      description: "Predicting corporate bankruptcy on a severely imbalanced dataset of Taiwanese companies (~3% rare event) through oversampling, wrapper feature selection, and Bayesian prior calibration.",
      details: [
        { 
          heading: "Question", 
          text: "How can we accurately identify companies at risk of bankruptcy when defaults represent only ~3% of the dataset, avoiding the high false-negative rate of standard classifiers?" 
        },
        { 
          heading: "Data and methods", 
          text: "Starting from the Kaggle Taiwanese Bankruptcy dataset (95 financial ratios), the training set was balanced via oversampling (70/30 split) and filtered using the Boruta wrapper algorithm. Seven models (Lasso, Naive Bayes, Logistic Regression, K-NN, Random Forest, Neural Networks, and Gradient Boosting) were tuned via 5-fold Cross-Validation." 
        },
        { 
          heading: "Results", 
          text: "Random Forest and Gradient Boosting achieved the highest ROC and Lift scores in the top deciles. Finally, predicted probabilities were recalibrated to true population priors (3% vs 97%) via Bayes' theorem, and the decision cutoff was optimized on the F1-measure to maximize sensitivity and precision on the validation set." 
        }
      ],
      links: [
        { label: "Report", url: "https://emimanfre.github.io/taiwan-bankruptcy-ml/analisi_bancarotta.html" },
        { label: "Code", url: "https://github.com/emimanfre/taiwan-bankruptcy-ml" },
        { label: "Dataset", url: "https://www.kaggle.com/datasets/fedesoriano/company-bankruptcy-prediction" }
      ] 
    },
    { title: "Project title 6", year: 2025, method: "Simulation", model: "Custom code · R / C++", tools: ["R", "C++"],
      description: "Placeholder: a simulation study on the bootstrap.",
      links: [{ label: "Code", url: "https://github.com/emimanfre" }] },
    { title: "Project title 7", year: 2025, method: "Classification", model: "Neural networks · PyTorch", tools: ["Python", "PyTorch"],
      description: "Placeholder: a neural network for a classification problem.",
      links: [{ label: "Code", url: "https://github.com/emimanfre" }] },
    { title: "Project title 8", year: 2025, method: "Simulation", model: "Machine learning · Python", tools: ["Python"],
      description: "Placeholder: cross-validation and bootstrap for model assessment.",
      links: [{ label: "Code", url: "https://github.com/emimanfre" }] },
    { title: "Project title 9", year: 2026, method: "Regression", model: "Bayesian models · Stan", tools: ["R", "Stan"],
      description: "Placeholder: a Bayesian state-space model.",
      links: [{ label: "Code", url: "https://github.com/emimanfre" }] },
    { title: "Project title 10", year: 2026, method: "Unsupervised learning", model: "Linear & GLM · R", tools: ["R", "ggplot2"],
      description: "Placeholder: exploratory analysis and clustering with custom graphics.",
      links: [{ label: "Code", url: "https://github.com/emimanfre" }] }
  ]
};

/* =========================================================
   Helpers and data
   ========================================================= */
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  kids.forEach(c => n.append(c));
  return n;
};
const NS = "http://www.w3.org/2000/svg";
const mk = (tag, attrs = {}) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  return n;
};
const ext = url => /^https?:/.test(url) ? { target: "_blank", rel: "noopener" } : {};
const touch = matchMedia("(hover: none)").matches;
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;

const P = CONFIG.projects;
const MODES = { method: "Methodology", model: "Models & code" };
let mode = CONFIG.startMode in MODES ? CONFIG.startMode : "method";
let hover = -1, focus = null;
const TREE = (CONFIG.methodTree || []).map(n => ({ name: n.name, leaves: n.children && n.children.length ? n.children : [n.name] }));
const parentOf = leaf => (TREE.find(n => n.leaves.includes(leaf)) || {}).name || null;
const methodPath = p => { const par = parentOf(p.method); return par && par !== p.method ? `${par} › ${p.method}` : (p.method || "-"); };

/* =========================================================
   Model: one group per project, links inside each group
   ========================================================= */
let M = null;
function buildModel() {
  const hier = mode === "method" && TREE.length > 0;
  const group = P.map(p => p[mode] || null);
  let keys = [], pOf = [], kOf = [], nSib = [], parents = [];
  if (hier) {
    group.forEach((g, i) => {
      if (g && !TREE.some(n => n.leaves.includes(g))) { console.warn(`Project "${P[i].title}": method "${g}" is not in methodTree.`); group[i] = null; }
    });
    TREE.filter(n => n.leaves.some(l => group.includes(l))).forEach((n, pi) => {
      const ls = n.leaves.filter(l => group.includes(l));
      parents.push(n.name);
      ls.forEach((l, k) => { keys.push(l); pOf.push(pi); kOf.push(k); nSib.push(ls.length); });
    });
  } else {
    keys = [...new Set(group.filter(g => g))];
    pOf = keys.map((_, i) => i); kOf = keys.map(() => 0); nSib = keys.map(() => 1);
  }
  const hasNull = group.includes(null);
  const nSlots = (hier ? parents.length : keys.length) + (hasNull ? 1 : 0);
  if (hasNull) { pOf.push(nSlots - 1); kOf.push(0); nSib.push(1); }
  const gi = group.map(g => g === null ? keys.length : keys.indexOf(g));
  const edges = [];
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++)
    if (group[i] !== null && group[i] === group[j]) edges.push({ a: i, b: j, w: 1 });
  const nb = P.map(() => new Set());
  edges.forEach(e => { nb[e.a].add(e.b); nb[e.b].add(e.a); });
  const colour = i => group[i] === null ? "var(--none)" : `var(--c${gi[i] % 8})`;
  M = { group, keys, gi, edges, nb, colour, pOf, kOf, nSib, parents, hier, nSlots, hasNull };
}

/* =========================================================
   Force layout (small, dependency-free)
   ========================================================= */
const narrow = matchMedia("(max-width:720px)").matches;
const W = narrow ? 520 : 900, H = narrow ? 640 : 560;
const N = P.map((_, i) => {
  const a = i / P.length * Math.PI * 2;
  return { x: W / 2 + Math.cos(a) * 160, y: H / 2 + Math.sin(a) * 140, vx: 0, vy: 0, fx: null, fy: null };
});
let alpha = 0, raf = 0, dragging = false;

function step() {
  const cx = W / 2, cy = H / 2, R = Math.min(W - 200, H) * 0.36;
  const centre = g => {
    const ang = M.pOf[g] / M.nSlots * 2 * Math.PI - Math.PI / 2;
    const bx = M.nSlots < 2 ? cx : cx + Math.cos(ang) * R * 1.35, by = M.nSlots < 2 ? cy : cy + Math.sin(ang) * R;
    return [bx + (M.kOf[g] - (M.nSib[g] - 1) / 2) * 125, by];
  };
  for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
    let dx = N[i].x - N[j].x, dy = N[i].y - N[j].y, d2 = dx * dx + dy * dy;
    if (d2 < 1) { dx = Math.random() - .5; dy = Math.random() - .5; d2 = 1; }
    const d = Math.sqrt(d2), f = 26000 / d2 * alpha / d;
    N[i].vx += dx * f; N[i].vy += dy * f; N[j].vx -= dx * f; N[j].vy -= dy * f;
    const ay = Math.abs(dy);                       // keep labels apart
    if (ay < 28 && Math.abs(dx) < 150) {
      const push = (28 - ay) * 0.12 * (dy >= 0 ? 1 : -1);
      N[i].vy += push; N[j].vy -= push;
    }
  }
  M.edges.forEach(e => {
    const A = N[e.a], B = N[e.b], dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 1;
    const f = (d - 130) * 0.03 * alpha / d;
    A.vx += dx * f; A.vy += dy * f; B.vx -= dx * f; B.vy -= dy * f;
  });
  N.forEach((n, i) => {
    const [gx, gy] = centre(M.gi[i]);
    n.vx += (gx - n.x) * 0.045 * alpha + (cx - n.x) * 0.004 * alpha;
    n.vy += (gy - n.y) * 0.045 * alpha + (cy - n.y) * 0.004 * alpha;
    n.vx *= 0.78; n.vy *= 0.78;
    const v = Math.hypot(n.vx, n.vy); if (v > 28) { n.vx *= 28 / v; n.vy *= 28 / v; }
    if (n.fx !== null) { n.x = n.fx; n.y = n.fy; n.vx = n.vy = 0; }
    else { n.x = Math.min(W - 170, Math.max(34, n.x + n.vx)); n.y = Math.min(H - 40, Math.max(M.hier ? 92 : 34, n.y + n.vy)); }
  });
}
function render() {
  renderBubbles();
  nodeEls.forEach((a, i) => a.setAttribute("transform", `translate(${N[i].x.toFixed(1)} ${N[i].y.toFixed(1)})`));
  edgeEls.forEach(({ line, e }) => {
    line.setAttribute("x1", N[e.a].x.toFixed(1)); line.setAttribute("y1", N[e.a].y.toFixed(1));
    line.setAttribute("x2", N[e.b].x.toFixed(1)); line.setAttribute("y2", N[e.b].y.toFixed(1));
  });
}
function renderBubbles() {
  bubbleEls.forEach(b => {
    let sx = 0, sy = 0, c = 0;
    N.forEach((n, i) => { if (M.pOf[M.gi[i]] === b.pi) { sx += n.x; sy += n.y; c++; } });
    if (!c) return;
    const cx = sx / c, cy = sy / c;
    let r = 0;
    N.forEach((n, i) => { if (M.pOf[M.gi[i]] === b.pi) r = Math.max(r, Math.hypot(n.x - cx, n.y - cy)); });
    r = Math.max(r + 38, 54);
    b.circle.setAttribute("cx", cx.toFixed(1)); b.circle.setAttribute("cy", cy.toFixed(1)); b.circle.setAttribute("r", r.toFixed(1));
    b.text.setAttribute("x", cx.toFixed(1)); b.text.setAttribute("y", Math.max(16, cy - r - 9).toFixed(1));
  });
}
function frame() {
  step(); render();
  alpha = dragging ? Math.max(alpha * 0.99, 0.25) : alpha * 0.985;
  raf = (alpha > 0.02 || dragging) ? requestAnimationFrame(frame) : 0;
}
function reheat(a = 1) {
  alpha = Math.max(alpha, a);
  if (calm) { for (let k = 0; k < 320; k++) { step(); alpha *= 0.985; } render(); alpha = 0; return; }
  if (!raf) raf = requestAnimationFrame(frame);
}

/* =========================================================
   Graph drawing and interaction
   ========================================================= */
const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, role: "group", "aria-label": "Projects graph" });
const bubbleLayer = mk("g"), edgeLayer = mk("g");
svg.append(bubbleLayer, edgeLayer);
let bubbleEls = [], edgeEls = [], nodeEls = [], legendBtns = [], drag = null, justDragged = false;

const preview = $("preview");
const idle = touch ? "Tap a project to preview it, tap again to open its page."
                   : "Hover a project to preview it, click to open its page. Drag to move it, click a group below to highlight it.";
function setPreview(i) {
  if (i < 0) { preview.replaceChildren(el("span", {}, idle)); return; }
  const p = P[i], f = (k, label) => { const v = k === "method" ? methodPath(p) : (p[k] || "-"); return el("span", {}, label + ": ", mode === k ? el("b", {}, v) : v); };
  preview.replaceChildren(el("strong", {}, `${String(i + 1).padStart(2, "0")} · ${p.title}`),
    f("method", MODES.method), el("span", {}, "  ·  "), f("model", MODES.model), el("span", {}, `  ·  ${p.year}`));
}
function paint() {
  const on = new Set();
  if (hover >= 0) { on.add(hover); M.nb[hover].forEach(j => on.add(j)); }
  else if (focus) M.gi.forEach((g, j) => { if (focus.includes(g)) on.add(j); });
  nodeEls.forEach((a, j) => a.classList.toggle("hl", on.has(j)));
  edgeEls.forEach(({ line, e }) => line.classList.toggle("hl",
    hover >= 0 ? (e.a === hover || e.b === hover) : (!!focus && focus.includes(M.gi[e.a]))));
  svg.classList.toggle("dim", on.size > 0);
  legendBtns.forEach(({ b, set }) => b.setAttribute("aria-pressed",
    String(!!focus && focus.length === set.length && set.every(x => focus.includes(x)))));
  setPreview(hover);
}
const toSvg = e => { const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); };

P.forEach((p, i) => {
  const a = mk("a", { href: `#/p/${i + 1}`, class: "node", "aria-label": `${i + 1}. ${p.title}` });
  a.append(mk("circle", { r: 16 }));
  const num = mk("text", { class: "num", y: 4.5 }); num.textContent = i + 1;
  const lab = mk("text", { class: "nlabel", x: 24, y: 5 }); lab.textContent = p.title;
  a.append(num, lab);
  a.addEventListener("mouseenter", () => { if (!touch) { hover = i; paint(); } });
  a.addEventListener("mouseleave", () => { if (!touch && !drag) { hover = -1; paint(); } });
  a.addEventListener("focus", () => { hover = i; paint(); });
  a.addEventListener("blur", () => { if (!touch) { hover = -1; paint(); } });
  a.addEventListener("pointerdown", e => {
    if (e.pointerType === "touch") return;
    drag = { i, x: e.clientX, y: e.clientY, moved: false }; a.setPointerCapture(e.pointerId);
  });
  a.addEventListener("pointermove", e => {
    if (!drag || drag.i !== i) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 5) { drag.moved = true; dragging = true; }
    if (drag.moved) { const q = toSvg(e); N[i].fx = q.x; N[i].fy = q.y; reheat(.5); }
  });
  a.addEventListener("pointerup", () => {
    if (!drag) return;
    justDragged = drag.moved; drag = null; dragging = false; N[i].fx = N[i].fy = null;
    setTimeout(() => { justDragged = false; }, 60);
  });
  a.addEventListener("click", e => {
    if (justDragged) { e.preventDefault(); return; }
    if (touch && hover !== i) { e.preventDefault(); hover = i; paint(); }
  });
  svg.append(a);
  nodeEls.push(a);
});
$("graph").append(svg);

function applyModel() {
  buildModel();
  $("plot-label").textContent = `Projects · grouped by ${MODES[mode].toLowerCase()}`;
  edgeLayer.replaceChildren();
  edgeEls = M.edges.map(e => {
    const line = mk("line", { class: "edge" });
    line.style.strokeWidth = 2.4;
    line.style.stroke = M.colour(e.a);
    edgeLayer.append(line);
    return { line, e };
  });
  nodeEls.forEach((a, i) => {
    a.classList.toggle("none", M.group[i] === null);
    a.firstChild.style.fill = M.group[i] === null ? "" : M.colour(i);
  });
  bubbleLayer.replaceChildren();
  bubbleEls = M.hier ? M.parents.map((name, pi) => {
    const g = mk("g", { class: "bubble" }), circle = mk("circle"), text = mk("text");
    text.textContent = name.toUpperCase();
    g.append(circle, text); bubbleLayer.append(g);
    return { circle, text, pi };
  }) : [];
  const lg = $("legend");
  lg.replaceChildren();
  legendBtns = [];
  const toggle = set => { focus = (focus && focus.length === set.length && set.every(x => focus.includes(x))) ? null : set; paint(); };
  const leafBtn = g => {
    const name = g < M.keys.length ? M.keys[g] : "Not specified";
    const b = el("button", { type: "button", "aria-pressed": "false" }, name, el("small", {}, String(M.gi.filter(x => x === g).length)));
    b.style.setProperty("--k", g < M.keys.length ? `var(--c${g % 8})` : "var(--none)");
    b.addEventListener("click", () => toggle([g]));
    legendBtns.push({ b, set: [g] });
    return b;
  };
  if (M.hier) {
    M.parents.forEach((name, pi) => {
      const leaves = M.keys.map((_, g) => g).filter(g => M.pOf[g] === pi);
      const li = el("li", { class: "grp" });
      if (leaves.length > 1) {
        const pb = el("button", { type: "button", class: "pbtn", "aria-pressed": "false" }, name);
        pb.addEventListener("click", () => toggle(leaves));
        legendBtns.push({ b: pb, set: leaves }); li.append(pb);
      }
      leaves.forEach(g => li.append(leafBtn(g)));
      lg.append(li);
    });
    if (M.hasNull) lg.append(el("li", { class: "grp" }, leafBtn(M.keys.length)));
  } else {
    M.keys.forEach((_, g) => lg.append(el("li", {}, leafBtn(g))));
    if (M.hasNull) lg.append(el("li", {}, leafBtn(M.keys.length)));
  }
  paint();
  reheat(1);
}

/* mode switch */
const modeBox = el("div", { class: "mode", role: "group", "aria-label": "Group projects by" });
const modeBtns = Object.entries(MODES).map(([key, label]) => {
  const b = el("button", { type: "button", "aria-pressed": String(key === mode) }, label);
  b.addEventListener("click", () => {
    if (mode === key) return;
    mode = key; focus = null; hover = -1;
    modeBtns.forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    applyModel();
  });
  modeBox.append(b);
  return b;
});
$("pick").append(el("span", { class: "label" }, "Group by"), modeBox);

/* =========================================================
   Home basics
   ========================================================= */
$("brand").textContent = CONFIG.name;
$("name").textContent = CONFIG.name;
$("tagline").textContent = CONFIG.tagline;
$("about-text").textContent = CONFIG.about;
CONFIG.contacts.forEach((c, i) =>
  $("actions").append(el("a", { class: "btn" + (i ? "" : " primary"), href: c.url, ...ext(c.url) }, c.label)));
CONFIG.skills.forEach(s =>
  $("skill-list").append(el("div", {}, el("h3", {}, s.title), el("p", {}, s.text))));
const foot = $("footer");
foot.append(el("span", {}, `© ${new Date().getFullYear()} ${CONFIG.name}`));
if (CONFIG.contacts[0]) foot.append(el("a", { href: CONFIG.contacts[0].url, ...ext(CONFIG.contacts[0].url) }, CONFIG.contacts[0].label));

if (!P.length) { $("projects").hidden = true; document.querySelector('nav a[href="#projects"]').hidden = true; }
else { for (let k = 0; k < 90 && !calm; k++) { if (k === 0) { buildModel(); alpha = 1; } step(); alpha *= 0.985; } applyModel(); render(); }

/* =========================================================
   Project page
   ========================================================= */
function showDetail(i) {
  const p = P[i], box = $("detail");
  const meta = el("div", { class: "meta" });
  if (p.method) meta.append(el("span", { class: "m" }, methodPath(p)));
  if (p.model) meta.append(el("span", { class: "c" }, p.model));
  (p.tools || []).forEach(t => meta.append(el("span", { class: "t" }, t)));
  const links = el("div", { class: "actions" });
  (p.links || []).forEach((l, k) => links.append(el("a", { class: "btn" + (k ? "" : " primary"), href: l.url, ...ext(l.url) }, l.label)));
  const why = q => {
    const w = [];
    if (p.method && q.method === p.method) w.push(q.method);
    else if (parentOf(p.method) && parentOf(p.method) === parentOf(q.method)) w.push(parentOf(q.method));
    if (p.model && q.model === p.model) w.push(q.model);
    return w;
  };
  const rel = P.map((q, j) => ({ j, why: why(q) })).filter(r => r.j !== i && r.why.length).sort((a, b) => b.why.length - a.why.length);
  const related = rel.length ? [el("h3", {}, "Related projects"),
    el("ul", { class: "related" }, ...rel.map(r => el("li", {}, el("a", { href: `#/p/${r.j + 1}` }, P[r.j].title), el("small", {}, ` — ${r.why.join(", ")}`))))] : [];
  const pager = el("div", { class: "pager" },
    i > 0 ? el("a", { href: `#/p/${i}` }, `← ${P[i - 1].title}`) : el("span"),
    i < P.length - 1 ? el("a", { href: `#/p/${i + 2}` }, `${P[i + 1].title} →`) : el("span"));
  box.replaceChildren(
    el("a", { class: "back", href: "#projects" }, "← All projects"),
    el("div", { class: "year" }, String(p.year)),
    el("h1", {}, p.title),
    meta,
    el("p", { class: "desc" }, p.description),
    ...(p.details || []).flatMap(s => [el("h3", {}, s.heading), el("p", { class: "sec" }, s.text)]),
    el("div", { style: "margin-top:2rem" }, links),
    ...related,
    pager
  );
  document.title = `${p.title} | ${CONFIG.name}`;
}

/* =========================================================
   Router: #/p/3 = project page, anything else = home
   ========================================================= */
function route() {
  const m = location.hash.match(/^#\/p\/(\d+)$/), i = m ? +m[1] - 1 : -1;
  if (P[i]) {
    $("home").hidden = true; $("detail").hidden = false;
    showDetail(i); window.scrollTo(0, 0);
  } else {
    $("home").hidden = false; $("detail").hidden = true;
    document.title = `${CONFIG.name} | Applied Statistics and Data Science`;
    const target = location.hash.length > 1 && document.getElementById(location.hash.slice(1));
    target ? target.scrollIntoView() : window.scrollTo(0, 0);
  }
}
addEventListener("hashchange", route);
route();
</script>
</body>
